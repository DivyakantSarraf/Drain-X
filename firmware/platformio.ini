; =============================================================================
; DRAIN-X Predictive Urban Drainage Intelligence System
; Embedded Firmware - ESP32 Node
; Milestone: P0.3A ESP32 Firmware Foundation & Simulated Telemetry
; =============================================================================

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize
build_flags = 
    -Wall
    -Wextra
